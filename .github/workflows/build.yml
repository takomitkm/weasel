name: Build weasel 0.17.4 + null_m_layout fix

# Builds the patched 0.17.4 on GitHub's own Windows runners (VS2022 + Windows SDK
# are preinstalled there). Produces the NSIS installer (x64 + Win32 + ARM64) and
# the debug symbols as workflow artifacts.
#
# Why this file exists instead of reusing .github/workflows/commit-ci.yml:
#   - commit-ci.yml targets `windows-2019`, which GitHub has retired, and
#     configures the build from env.vs2019.bat (toolset v142 / bjam msvc-14.2);
#   - this one targets `windows-2022` and uses env.vs2022.bat (v143 / msvc-14.3).
# Everything else follows the upstream steps (bootstrap boost, fetch prebuilt
# librime with get-rime.ps1 -use dev, build data, build weasel + installer).

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022
    env:
      boost_version: 1.84.0
      BOOST_ROOT: ${{ github.workspace }}\deps\boost_1_84_0
      # The projects do not pin an SDK version, so msbuild picks the newest one
      # installed on the image (10.0.26100.0), and that SDK dropped 32-bit ARM
      # support -> `error MSB8087` in the Release|ARM configuration that
      # `build.bat arm64` builds. 10.0.22621.0 still supports ARM32 and is also
      # installed on the windows-2022 image.
      WindowsTargetPlatformVersion: 10.0.22621.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # recursive: `build.bat data` runs librime's own deps build (glog,
          # yaml-cpp, opencc, ...) to produce librime\share\opencc\*.ocd2, and
          # those deps are submodules of librime.
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags

      - name: Configure build environment (VS2022)
        shell: bash
        run: |
          cp env.vs2022.bat env.bat
          echo git_ref_name="$(git describe --always)" >> "$GITHUB_ENV"

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-boost-${{ env.boost_version }}

      - name: Install Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          ./install_boost.bat
          ./build.bat boost arm64

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Get Rime files
        shell: pwsh
        env:
          RIME_API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # get-rime.ps1 sources ~/.get-rime.conf.ps1 and takes $authorization
          # from it. Without a token its api.github.com request hits the
          # anonymous rate limit on the shared runner IPs ("403 rate limit
          # exceeded"); the script then exits quietly, the step still looks
          # green, and the build fails later on a missing rime_api.h.
          $conf = Join-Path $env:USERPROFILE '.get-rime.conf.ps1'
          Set-Content -Path $conf -Value ('$global:authorization = "' + $env:RIME_API_TOKEN + '"') -Encoding ascii
          # 1.13.1 is the librime release whose Windows msvc packages are built
          # from 1c23358, the commit librime/ is pinned to in this tree - i.e.
          # the librime the official 0.17.4 installer shipped (that package's
          # dist/lib/rime.dll is byte-identical to the installed 0.17.4
          # rime.dll). Pinning the tag keeps this rebuild identical to 0.17.4
          # apart from our patch, instead of pulling today's librime.
          .\get-rime.ps1 -use dev -tag 1.13.1
          Remove-Item $conf -ErrorAction SilentlyContinue

          Write-Host '--- verifying rime files ---'
          $need = @(
            'include\rime_api.h', 'include\rime_levers_api.h',
            'lib64\rime.lib', 'lib\rime.lib',
            'output\rime.dll', 'output\Win32\rime.dll',
            'output\rime.pdb', 'output\Win32\rime.pdb'
          )
          $missing = @($need | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) { throw ('get-rime.ps1 did not deliver: ' + ($missing -join ', ')) }
          $hash = (Get-FileHash 'output\rime.dll' -Algorithm SHA256).Hash
          Write-Host ('output\rime.dll sha256 = ' + $hash)
          if ($hash -ne '2D8F1BC3737635A11D9FB1BFCA4DC9E70533633930A8A0142A81CA879C39C45B') {
            throw ('unexpected rime.dll: ' + $hash)
          }

      - name: Build data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.bat data
          # build.bat swallows failures, and the opencc data comes from
          # librime's own deps build, so check that it really landed
          if (-not (Test-Path 'output\data\opencc\TSCharacters.ocd2')) {
            Write-Host '--- librime\share\opencc ---'
            Get-ChildItem librime\share\opencc -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
            throw 'output\data\opencc\TSCharacters.ocd2 is missing - the librime deps/opencc build did not work'
          }

      - name: Build Weasel (x64, Win32, ARM, ARM64) + installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # build.bat's `:error` label only echoes and then falls through to
          # `:end`, so the batch file returns 0 even when msbuild failed.
          # Verify the expected outputs ourselves instead of trusting it.
          .\build.bat arm64 installer

          Write-Host '--- verifying build outputs ---'
          # Names as they actually land in output\: the x86 and x64 binaries sit
          # side by side there (weasel.dll / weaselx64.dll), only the x86 exes
          # go to output\Win32\.
          $required = @(
            'output\weasel.dll',
            'output\weaselx64.dll',
            'output\weasel.ime',
            'output\weaselx64.ime',
            'output\WeaselServer.exe',
            'output\WeaselDeployer.exe',
            'output\WeaselSetup.exe',
            'output\Win32\WeaselServer.exe',
            'output\Win32\WeaselDeployer.exe',
            'output\rime.dll',
            'output\WinSparkle.dll'
          )
          $missing = @($required | Where-Object { -not (Test-Path $_) })
          $installer = @(Get-ChildItem 'output\archives' -Filter 'weasel*-installer.exe' -ErrorAction SilentlyContinue)
          # every msbuild log the script left behind must have ended cleanly
          $badLogs = @()
          foreach ($l in @(Get-ChildItem msbuild*.log -ErrorAction SilentlyContinue)) {
            if (-not (Select-String -Path $l.FullName -Pattern '0 Error\(s\)' -Quiet)) { $badLogs += $l.Name }
          }
          if ($missing.Count -gt 0 -or $installer.Count -eq 0 -or $badLogs.Count -gt 0) {
            Write-Host '### build outputs missing ###'
            if ($missing.Count -gt 0) { Write-Host ('  missing: ' + ($missing -join ', ')) }
            if ($installer.Count -eq 0) { Write-Host '  missing: output\archives\weasel*-installer.exe' }
            if ($badLogs.Count -gt 0) { Write-Host ('  msbuild logs without "0 Error(s)": ' + ($badLogs -join ', ')) }
            Get-ChildItem msbuild*.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ('--- tail of ' + $_.Name + ' ---')
              Get-Content $_.FullName -Tail 80
            }
            foreach ($d in @('output', 'output\Win32', 'output\archives')) {
              Write-Host ('--- ' + $d + ' ---')
              Get-ChildItem $d -ErrorAction SilentlyContinue | ForEach-Object { '  {0}  {1} B' -f $_.Name, $_.Length }
            }
            throw 'weasel build did not produce the expected outputs'
          }
          Write-Host ('installer: ' + (($installer | ForEach-Object { '{0} ({1} B)' -f $_.Name, $_.Length }) -join ', '))

      - name: Show build output
        if: always()
        shell: pwsh
        run: |
          Write-Host '--- output\archives ---'
          Get-ChildItem output\archives -ErrorAction SilentlyContinue | ForEach-Object { '{0}  {1} B' -f $_.Name, $_.Length }
          Write-Host '--- output\*.pdb ---'
          Get-ChildItem output\*.pdb -ErrorAction SilentlyContinue | ForEach-Object { '{0}  {1} B' -f $_.Name, $_.Length }

      - name: Compress debug symbols
        # always: a late verification failure should still leave the symbols
        # (and the installer) in the artifact for inspection
        if: always()
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          Write-Host "using $sevenZip"
          & $sevenZip a -t7z 'output/archives/debug_symbols.7z' 'output/*.pdb' -r

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasel-0.17.4-patched
          if-no-files-found: error
          path: |
            output\archives\weasel*.exe
            output\archives\debug_symbols.7z
